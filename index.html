<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikołajki 🎅</title>
<style>
:root{--bg:#fdf3f0;--card:#fff;--tx:#2a1a1a;--mut:#7a6462;--red:#c0392b;--grn:#1e7a46;--bd:#ecd5d0;color-scheme:light light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1212;--card:#2a1b1b;--tx:#f6e9e6;--mut:#b99d99;--red:#e0574a;--grn:#4cc486;--bd:#4a3030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{text-align:center;margin:8px 0 4px;font-size:1.9rem}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 6px}
select,input,textarea{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:600;background:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.big{width:100%;margin-top:12px;padding:14px;font-size:1.1rem}
.res{text-align:center;padding:10px 0}
.res .n{font-size:2rem;font-weight:800;color:var(--grn);margin:6px 0}
.msg{color:var(--mut);text-align:center;margin:8px 0 0}
.err{color:var(--red)}
.row{padding:6px 0;border-bottom:1px solid var(--bd)}
.add{display:flex;gap:8px}
.foot{text-align:center;margin-top:24px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>🎅 Mikołajki 🎁</h1>
  <p class="sub">Wybierz swoje imię, wpisz swój kod i zobacz, komu kupujesz prezent.</p>

  <section id="userView" class="card">
    <label for="who">Kim jesteś?</label>
    <select id="who"></select>
    <label for="code">Twój kod (dostałeś go od organizatora)</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="np. 123456">
    <button class="big" id="showBtn" disabled>🎁 Pokaż mój wynik</button>
    <div class="res hide" id="res">
      <div>Kupujesz prezent dla:</div>
      <div class="n" id="resName"></div>
      <div class="msg">Zapamiętaj! Po zamknięciu strony nie zobaczysz wyniku ponownie na tym urządzeniu.</div>
    </div>
    <div class="msg" id="userMsg"></div>
  </section>

  <section id="pwBox" class="card hide">
    <label for="pw">Hasło admina</label>
    <div class="add"><input id="pw" type="password" autocomplete="off"><button id="pwBtn">Wejdź</button></div>
    <div class="msg" id="pwMsg"></div>
  </section>

  <section id="adminView" class="card hide">
    <label for="names">Uczestnicy (jedno imię w linii, minimum 3)</label>
    <textarea id="names" rows="8"></textarea>
    <button class="big" id="drawAll">🎲 Wylosuj wszystkich</button>
    <div class="msg" id="adminMsg"></div>
    <div id="adminRes" class="hide" style="margin-top:12px"></div>
    <button class="big hide" id="dl" style="background:var(--grn)">⬇️ Pobierz gotowy plik index.html</button>
  </section>

  <div class="foot"><button class="ghost" id="adminToggle">🔒 Panel admina</button></div>
</main>

<script>
(function(){
  var PASSWORD = 'admin123', MAX_TRIES = 5;
  var DATA = /*D*/{"p":[{"n":"Bartosz","s":"KvuX0s20KS5XhIfYwKNmSA==","i":"d4UYBhQXpXP9nuP5","c":"G4EjDldywJcCt2No8kgMzWhniGU6"},{"n":"Bożena","s":"k6ennAdjPIMNQ8eytqSqeg==","i":"tRM5qQ7Xnw6nSmIw","c":"CWPJ8hiWdH++jcr33W+DP5DTUtjqNLA="},{"n":"Dominika","s":"FhZU1myoKhZF2Hkgflo3pA==","i":"RP2o42wynEopuxmn","c":"uZxynhAULBNPtGQBrrVvGHMoa8z6ops="},{"n":"Janek","s":"A6q7RoxDwQ8qdfn1aHJZzQ==","i":"tkSap/ybtEv9SO5V","c":"dFVsy+WUggyKXAZXdTpQbOAPzQC9"},{"n":"Maria","s":"hK3pdooKnFka5tsU0SAQLA==","i":"q/TlfCu0amA2mZg7","c":"OcUYDn4YurUhPr/gnxKx4vY1Mli0"},{"n":"Mirka","s":"x5hjOa/am351QpzuhcNMeg==","i":"rqBq5F2FBoQPiWQ1","c":"qdk0ISneCa4bb0v6eYzTtKSVa96xFXw="},{"n":"Włodek","s":"3RmD+XeyhVECWlxfaP7j3A==","i":"dhgaKqhBQ16RnCJo","c":"vUfnPV93PNw/9RfekDZTAqD6mBWidDJ/"}]}/*E*/;
  var SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var $ = function(id){ return document.getElementById(id); };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var out = null;

  function b64(u){ var s = ''; u.forEach(function(b){ s += String.fromCharCode(b); }); return btoa(s); }
  function u8(s){ var r = atob(s), a = new Uint8Array(r.length); for(var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function store(k, v){ try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  function key(pin, salt){
    return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function lockedOnDevice(n){ return store('mk_done_' + n) === '1' || Number(store('mk_try_' + n) || 0) >= MAX_TRIES; }

  function renderUser(){
    var sel = $('who'); sel.innerHTML = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = '— wybierz swoje imię —'; sel.appendChild(o);
    if(DATA) DATA.p.forEach(function(x, i){
      var op = document.createElement('option'); op.value = i; op.textContent = x.n + (lockedOnDevice(x.n) ? ' 🔒' : ''); sel.appendChild(op);
    });
    $('userMsg').textContent = DATA ? '' : 'Losowanie jeszcze nie jest gotowe. Organizator musi je przygotować.';
    $('showBtn').disabled = true;
  }
  function checkReady(){ $('showBtn').disabled = !($('who').value !== '' && $('code').value.trim()); }
  $('who').onchange = function(){
    $('res').classList.add('hide'); $('code').value = '';
    var x = DATA && DATA.p[this.value], m = $('userMsg'); m.className = 'msg'; m.textContent = '';
    if(x && lockedOnDevice(x.n)){ m.textContent = 'To imię jest zablokowane na tym urządzeniu.'; m.className = 'msg err'; }
    checkReady();
  };
  $('code').oninput = checkReady;
  $('code').onkeydown = function(e){ if(e.key === 'Enter' && !$('showBtn').disabled) reveal(); };
  $('showBtn').onclick = reveal;

  function reveal(){
    var x = DATA.p[$('who').value], m = $('userMsg');
    m.className = 'msg err';
    if(lockedOnDevice(x.n)){ m.textContent = 'To imię jest zablokowane na tym urządzeniu.'; renderKeep(); return; }
    key($('code').value.trim(), u8(x.s)).then(function(k){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(x.i) }, k, u8(x.c));
    }).then(function(buf){
      $('resName').textContent = dec.decode(buf); $('res').classList.remove('hide');
      $('code').value = ''; $('showBtn').disabled = true; m.textContent = '';
      store('mk_done_' + x.n, '1');
    }, function(){
      var t = Number(store('mk_try_' + x.n) || 0) + 1; store('mk_try_' + x.n, String(t));
      m.textContent = t >= MAX_TRIES ? 'Zbyt wiele błędnych prób. Imię zablokowane na tym urządzeniu.' : 'Zły kod. Zostało prób: ' + (MAX_TRIES - t) + '.';
    });
  }
  function renderKeep(){ var v = $('who').value; renderUser(); $('who').value = v; }

  $('adminToggle').onclick = function(){
    if(!$('adminView').classList.contains('hide')){ $('adminView').classList.add('hide'); return; }
    $('pwBox').classList.toggle('hide'); $('pw').focus();
  };
  function login(){
    if($('pw').value === PASSWORD){
      $('pw').value = ''; $('pwBox').classList.add('hide'); $('adminView').classList.remove('hide');
      if(DATA && !$('names').value) $('names').value = DATA.p.map(function(x){ return x.n; }).join('\n');
    } else { $('pwMsg').textContent = 'Złe hasło.'; $('pwMsg').className = 'msg err'; }
  }
  $('pwBtn').onclick = login;
  $('pw').onkeydown = function(e){ if(e.key === 'Enter') login(); };

  $('drawAll').onclick = function(){
    var seen = {}, names = [], m = $('adminMsg');
    $('names').value.split('\n').forEach(function(l){
      var n = l.trim(), k = n.toLowerCase();
      if(n && !seen[k]){ seen[k] = 1; names.push(n); }
    });
    if(names.length < 3){ m.textContent = 'Potrzeba co najmniej 3 różnych imion.'; m.className = 'msg err'; return; }
    for(var i = names.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = names[i]; names[i] = names[j]; names[j] = t; }
    m.textContent = 'Losuję i szyfruję…'; m.className = 'msg';
    var jobs = names.map(function(n, i){
      var target = names[(i + 1) % names.length];
      var pin = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
      var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      return key(pin, salt).then(function(k){ return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, enc.encode(target)); })
        .then(function(c){ return { n: n, target: target, pin: pin, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(c)) }; });
    });
    Promise.all(jobs).then(function(list){
      out = list.sort(function(a, b){ return a.n.localeCompare(b.n, 'pl'); });
      m.textContent = 'Gotowe! Roześlij każdej osobie jej kod (prywatnie), a potem pobierz plik.';
      var box = $('adminRes'); box.innerHTML = '';
      out.forEach(function(p){
        var r = document.createElement('div'); r.className = 'row';
        r.textContent = p.n + ' — kod: ' + p.pin + ' — kupuje dla: ' + p.target; box.appendChild(r);
      });
      box.classList.remove('hide'); $('dl').classList.remove('hide');
    });
  };

  $('dl').onclick = function(){
    if(!out) return;
    var json = JSON.stringify({ p: out.map(function(p){ return { n: p.n, s: p.s, i: p.i, c: p.c }; }) });
    var html = SRC.replace(/\/\*D\*\/[\s\S]*?\/\*E\*\//, function(){ return '/*D*/' + json + '/*E*/'; });
    var m = $('adminMsg');
    if(typeof claude === 'undefined' || !claude.use){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      m.textContent = 'Pobrano index.html. Wrzuć go na GitHub albo Netlify.'; m.className = 'msg';
      return;
    }
    claude.use('downloads').then(function(d){
      if(!d){ m.textContent = 'Pobieranie jest tu niedostępne. Otwórz plik index.html na komputerze.'; m.className = 'msg err'; return; }
      return d.save({ filename: 'index.html', data: html }).then(function(){
        m.textContent = 'Pobrano index.html. Wrzuć go na GitHub albo Netlify.'; m.className = 'msg';
      }, function(e){
        m.textContent = (e && e.code === 'declined') ? 'Anulowano pobieranie.' : 'Nie udało się pobrać pliku.'; m.className = 'msg err';
      });
    });
  };

  renderUser();
})();
</script>
</body>
</html>
