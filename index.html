<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikołajki 🎅</title>
<style>
:root{--bg:#fdf3f0;--card:#fff;--tx:#2a1a1a;--mut:#7a6462;--red:#c0392b;--red2:#a93226;--grn:#1e7a46;--bd:#ecd5d0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1212;--card:#2a1b1b;--tx:#f6e9e6;--mut:#b99d99;--red:#e0574a;--red2:#c9473b;--grn:#4cc486;--bd:#4a3030;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{text-align:center;margin:8px 0 4px;font-size:1.9rem}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
select,input{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:600;background:var(--red);color:#fff}
button:hover{background:var(--red2)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.ghost:hover{background:var(--bg)}
button.big{width:100%;margin-top:12px;padding:14px;font-size:1.1rem}
.result{text-align:center;padding:10px 0}
.result .name{font-size:2rem;font-weight:800;color:var(--grn);margin:6px 0}
.msg{color:var(--mut);text-align:center;margin:8px 0 0;min-height:1.4em}
.err{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .n{flex:1;overflow-wrap:anywhere}
.row small{color:var(--mut)}
.add{display:flex;gap:8px;margin-bottom:10px}
.add button{white-space:nowrap}
.foot{text-align:center;margin-top:24px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>🎅 Mikołajki 🎁</h1>
  <p class="sub">Wybierz siebie z listy i wylosuj osobę, której kupisz prezent.</p>

  <section id="drawView">
    <div class="card">
      <label for="who">Kim jesteś?</label>
      <select id="who"></select>
      <button class="big" id="drawBtn" disabled>🎲 Losuj!</button>
      <div class="msg" id="drawMsg">Łączenie z chmurą…</div>
      <div class="result hide" id="result">
        <div>Twoja wylosowana osoba to:</div>
        <div class="name" id="resName"></div>
        <button class="ghost" id="hideBtn">Ukryj wynik</button>
      </div>
    </div>
  </section>

  <section id="adminView" class="hide">
    <div class="card">
      <label for="newName">Dodaj uczestnika</label>
      <div class="add">
        <input id="newName" maxlength="40" placeholder="Imię" autocomplete="off">
        <button id="addBtn">Dodaj</button>
      </div>
      <div id="adminList"></div>
      <div class="msg" id="adminMsg"></div>
    </div>
    <div class="card">
      <button class="ghost" id="showAll">👀 Pokaż wszystkie wyniki (spoiler!)</button>
      <div id="allResults" class="hide" style="margin-top:10px"></div>
      <button class="big" id="resetBtn" style="background:#7a6462">♻️ Resetuj losowanie</button>
    </div>
  </section>

  <div class="card hide" id="pwBox">
    <label for="pw">Hasło admina</label>
    <div class="add"><input id="pw" type="password" autocomplete="off" placeholder="Hasło"><button id="pwBtn">Wejdź</button></div>
    <div class="msg" id="pwMsg"></div>
  </div>
  <div class="foot"><button class="ghost" id="adminToggle">🔒 Panel admina</button></div>
</main>

<script>
(function(){
  var ADMIN_PASSWORD = 'admin123';
  var $ = function(id){ return document.getElementById(id); };
  var db = null, people = [], isAdmin = false, selected = '', showResult = false, showAll = false, busy = false, armed = '';
  var holder = 'h' + Math.random().toString(36).slice(2);
  var loadTimer = setTimeout(function(){ if(!db) setMsg('Nie można połączyć się z chmurą. Odśwież stronę lub sprawdź dostęp do linku.', true); }, 10000);

  function setMsg(t, err){ var m = $('drawMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
  function byId(id){ return people.find(function(p){ return p.id === id; }); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function render(){
    var sel = $('who'), prev = selected;
    sel.innerHTML = '';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '— wybierz swoje imię —'; sel.appendChild(o0);
    people.forEach(function(p){ var o = document.createElement('option'); o.value = p.id; o.textContent = p.name + (p.target ? ' ✓' : ''); sel.appendChild(o); });
    if(byId(prev)) sel.value = prev; else { selected = ''; sel.value = ''; }
    var me = byId(selected);
    var btn = $('drawBtn');
    btn.disabled = !db || !me || busy;
    btn.textContent = me && me.target ? '👁 Pokaż mój wynik' : '🎲 Losuj!';
    if(db && !busy){
      if(!people.length) setMsg('Brak uczestników — admin musi ich dodać w panelu.');
      else if(!me) setMsg('Wybierz siebie z listy.');
      else if(me.target) setMsg('Już losowałeś/aś. Możesz zobaczyć wynik ponownie.');
      else setMsg('Kliknij „Losuj!”');
    }
    var t = me && me.target ? byId(me.target) : null;
    $('result').classList.toggle('hide', !(showResult && t));
    if(t) $('resName').textContent = t.name;
    renderAdmin();
  }

  function renderAdmin(){
    $('adminView').classList.toggle('hide', !isAdmin);
    $('adminToggle').textContent = isAdmin ? '🔓 Wyloguj admina' : '🔒 Panel admina';
    if(!isAdmin) return;
    var list = $('adminList'); list.innerHTML = '';
    people.forEach(function(p){
      var r = document.createElement('div'); r.className = 'row';
      var n = document.createElement('span'); n.className = 'n'; n.textContent = p.name;
      var s = document.createElement('small'); s.textContent = p.target ? 'wylosował(a) ✓' : 'jeszcze nie';
      var b = document.createElement('button'); b.className = 'ghost'; b.textContent = 'Usuń';
      b.onclick = function(){ removePerson(p); };
      r.appendChild(n); r.appendChild(s); r.appendChild(b); list.appendChild(r);
    });
    var all = $('allResults'); all.classList.toggle('hide', !showAll); all.innerHTML = '';
    if(showAll) people.forEach(function(p){
      var r = document.createElement('div'); r.className = 'row';
      var t = byId(p.target);
      r.textContent = p.name + ' → ' + (t ? t.name : '—');
      all.appendChild(r);
    });
  }

  function adminMsg(t, err){ var m = $('adminMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }

  async function addPerson(){
    var name = $('newName').value.trim();
    if(!name || !db) return;
    if(people.some(function(p){ return p.name.toLowerCase() === name.toLowerCase(); })){ adminMsg('Taka osoba już jest na liście.', true); return; }
    if(people.some(function(p){ return p.target; })){ adminMsg('Losowanie już się zaczęło — najpierw zresetuj losowanie.', true); return; }
    try { await db.collection('participants').add({ name: name, target: null, createdAt: Date.now() }); $('newName').value = ''; adminMsg('Dodano: ' + name); }
    catch(e){ adminMsg('Nie udało się dodać (' + (e && e.code || 'błąd') + ').', true); }
  }

  async function removePerson(p){
    if(people.some(function(x){ return x.target; })){ adminMsg('Losowanie już się zaczęło — najpierw zresetuj losowanie.', true); return; }
    if(armed !== 'del' + p.id){ armed = 'del' + p.id; adminMsg('Kliknij „Usuń” jeszcze raz, aby usunąć: ' + p.name); return; }
    armed = '';
    try { await db.doc('participants/' + p.id).delete(); adminMsg('Usunięto.'); } catch(e){ adminMsg('Nie udało się usunąć.', true); }
  }

  async function resetAll(){
    if(armed !== 'reset'){ armed = 'reset'; adminMsg('Kliknij „Resetuj losowanie” jeszcze raz, aby potwierdzić (uczestnicy zostaną na liście).'); return; }
    armed = '';
    try {
      for(var i = 0; i < people.length; i++){ if(people[i].target) await db.doc('participants/' + people[i].id).update({ target: null }); }
      showResult = false; adminMsg('Losowanie zresetowane.');
    } catch(e){ adminMsg('Nie udało się zresetować.', true); }
  }

  async function draw(){
    var me = byId(selected);
    if(!me || !db) return;
    if(me.target){ showResult = true; render(); return; }
    busy = true; render(); setMsg('Losuję…');
    try {
      var lock = db.doc('meta/lock'), got = false;
      for(var i = 0; i < 12 && !got; i++){
        var r = await lock.acquire({ holder: holder, ttlMs: 3000 });
        if(r.acquired) got = true; else await sleep(600 + Math.random() * 500);
      }
      if(!got) throw new Error('busy');
      var snap = await db.collection('participants').get();
      var ps = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      var cur = ps.find(function(p){ return p.id === me.id; });
      if(!cur) throw new Error('gone');
      if(!cur.target){
        var taken = ps.map(function(p){ return p.target; }).filter(Boolean);
        var free = ps.filter(function(p){ return taken.indexOf(p.id) < 0 && p.id !== me.id; });
        var waiting = ps.filter(function(p){ return !p.target && p.id !== me.id; });
        var ok = free.filter(function(t){
          var rt = ps.filter(function(p){ return taken.indexOf(p.id) < 0 && p.id !== t.id; });
          return !(waiting.length === 1 && rt.length === 1 && rt[0].id === waiting[0].id);
        });
        if(!ok.length) throw new Error('none');
        var pick = ok[Math.floor(Math.random() * ok.length)];
        await db.doc('participants/' + me.id).update({ target: pick.id });
      }
      showResult = true; busy = false;
    } catch(e){
      busy = false; render();
      setMsg('Nie udało się wylosować. Spróbuj jeszcze raz za chwilę.' + (e && e.message === 'none' ? ' (brak wolnych osób — poproś admina o reset)' : ''), true);
      return;
    }
    render();
  }

  $('who').onchange = function(){ selected = this.value; showResult = false; render(); };
  $('drawBtn').onclick = draw;
  $('hideBtn').onclick = function(){ showResult = false; render(); };
  $('addBtn').onclick = addPerson;
  $('newName').onkeydown = function(e){ if(e.key === 'Enter') addPerson(); };
  $('resetBtn').onclick = resetAll;
  $('showAll').onclick = function(){ showAll = !showAll; render(); };
  $('adminToggle').onclick = function(){
    if(isAdmin){ isAdmin = false; showAll = false; render(); return; }
    var box = $('pwBox'); box.classList.toggle('hide'); $('pwMsg').textContent = '';
    if(!box.classList.contains('hide')) $('pw').focus();
  };
  function tryLogin(){
    if($('pw').value === ADMIN_PASSWORD){ isAdmin = true; $('pw').value = ''; $('pwBox').classList.add('hide'); render(); }
    else { $('pwMsg').textContent = 'Złe hasło.'; $('pwMsg').className = 'msg err'; }
  }
  $('pwBtn').onclick = tryLogin;
  $('pw').onkeydown = function(e){ if(e.key === 'Enter') tryLogin(); };

  render();
  claude.use('db').then(function(d){
    if(!d){ setMsg('Brak połączenia z chmurą. Otwórz stronę przez link zalogowany na konto z dostępem.', true); return; }
    db = d;
    d.collection('participants').onSnapshot(function(snap){
      clearTimeout(loadTimer);
      people = snap.docs.map(function(x){ return Object.assign({ id: x.id }, x.data()); })
        .sort(function(a, b){ return String(a.name).localeCompare(String(b.name), 'pl'); });
      render();
    }, function(){ setMsg('Błąd połączenia z chmurą.', true); });
  });
})();
</script>
</body>
</html>
