<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikołajki 🎅</title>
<style>
:root{--bg:#fdf3f0;--card:#fff;--tx:#2a1a1a;--mut:#7a6462;--red:#c0392b;--grn:#1e7a46;--bd:#ecd5d0;color-scheme:light light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1212;--card:#2a1b1b;--tx:#f6e9e6;--mut:#b99d99;--red:#e0574a;--grn:#4cc486;--bd:#4a3030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{text-align:center;margin:8px 0 4px;font-size:1.9rem}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
select,input,textarea{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:600;background:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.big{width:100%;margin-top:12px;padding:14px;font-size:1.1rem}
.res{text-align:center;padding:10px 0}
.res .n{font-size:2rem;font-weight:800;color:var(--grn);margin:6px 0}
.msg{color:var(--mut);text-align:center;margin:8px 0 0}
.err{color:var(--red)}
.row{padding:6px 0;border-bottom:1px solid var(--bd)}
.add{display:flex;gap:8px}
.foot{text-align:center;margin-top:24px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>🎅 Mikołajki 🎁</h1>
  <p class="sub">Wybierz swoje imię i zobacz, komu kupujesz prezent.</p>

  <section id="userView" class="card">
    <label for="who">Kim jesteś?</label>
    <select id="who"></select>
    <button class="big" id="showBtn" disabled="">🎁 Pokaż mój wynik</button>
    <div class="res hide" id="res">
      <div>Kupujesz prezent dla:</div>
      <div class="n" id="resName"></div>
      <button class="ghost" id="hideBtn">Ukryj wynik</button>
    </div>
    <div class="msg" id="userMsg"></div>
  </section>

  <section id="pwBox" class="card hide">
    <label for="pw">Hasło admina</label>
    <div class="add"><input id="pw" type="password" autocomplete="off"><button id="pwBtn">Wejdź</button></div>
    <div class="msg" id="pwMsg"></div>
  </section>

  <section id="adminView" class="card hide">
    <label for="names">Uczestnicy (jedno imię w linii, minimum 3)</label>
    <textarea id="names" rows="8"></textarea>
    <button class="big" id="drawAll">🎲 Wylosuj wszystkich</button>
    <div class="msg" id="adminMsg"></div>
    <div id="adminRes" class="hide" style="margin-top:12px"></div>
    <button class="big hide" id="dl" style="background:var(--grn)">⬇️ Pobierz gotowy plik index.html</button>
  </section>

  <div class="foot"><button class="ghost" id="adminToggle">🔒 Panel admina</button></div>
</main>

<script>
(function(){
  var PASSWORD = 'admin123';
  var DATA = /*D*/{"p":[["TWlya2E=","TWFyaWE="],["TWFyaWE=","RG9taW5pa2E="],["RG9taW5pa2E=","SmFuZWs="],["SmFuZWs=","V8WCb2Rlaw=="],["V8WCb2Rlaw==","QmFydG9zeg=="],["QmFydG9zeg==","Qm/FvGVuYQ=="],["Qm/FvGVuYQ==","TWlya2E="]]}/*E*/;
  var SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var $ = function(id){ return document.getElementById(id); };
  var pairs = null;
  function enc(s){ return btoa(unescape(encodeURIComponent(s))); }
  function dec(s){ return decodeURIComponent(escape(atob(s))); }

  function renderUser(){
    var sel = $('who'); sel.innerHTML = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = '— wybierz swoje imię —'; sel.appendChild(o);
    if(DATA){
      DATA.p.forEach(function(x, i){ var op = document.createElement('option'); op.value = i; op.textContent = dec(x[0]); sel.appendChild(op); });
      $('userMsg').textContent = '';
    } else {
      $('userMsg').textContent = 'Losowanie jeszcze nie jest gotowe. Admin musi je przygotować.';
    }
    $('showBtn').disabled = true;
  }
  $('who').onchange = function(){ $('showBtn').disabled = this.value === ''; $('res').classList.add('hide'); };
  $('showBtn').onclick = function(){
    var x = DATA.p[$('who').value];
    $('resName').textContent = dec(x[1]);
    $('res').classList.remove('hide');
  };
  $('hideBtn').onclick = function(){ $('res').classList.add('hide'); };

  $('adminToggle').onclick = function(){
    if(!$('adminView').classList.contains('hide')){ $('adminView').classList.add('hide'); return; }
    $('pwBox').classList.toggle('hide'); $('pw').focus();
  };
  function login(){
    if($('pw').value === PASSWORD){
      $('pw').value = ''; $('pwBox').classList.add('hide'); $('adminView').classList.remove('hide');
      if(DATA && !$('names').value) $('names').value = DATA.p.map(function(x){ return dec(x[0]); }).join('\n');
    } else { $('pwMsg').textContent = 'Złe hasło.'; $('pwMsg').className = 'msg err'; }
  }
  $('pwBtn').onclick = login;
  $('pw').onkeydown = function(e){ if(e.key === 'Enter') login(); };

  $('drawAll').onclick = function(){
    var seen = {}, names = [];
    $('names').value.split('\n').forEach(function(l){
      var n = l.trim(), k = n.toLowerCase();
      if(n && !seen[k]){ seen[k] = 1; names.push(n); }
    });
    var m = $('adminMsg');
    if(names.length < 3){ m.textContent = 'Potrzeba co najmniej 3 różnych imion.'; m.className = 'msg err'; return; }
    for(var i = names.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = names[i]; names[i] = names[j]; names[j] = t; }
    pairs = names.map(function(n, i){ return [n, names[(i + 1) % names.length]]; });
    m.textContent = 'Gotowe! Każdy ma inną osobę i nikt nie wylosował siebie.'; m.className = 'msg';
    var box = $('adminRes'); box.innerHTML = '';
    pairs.slice().sort(function(a, b){ return a[0].localeCompare(b[0], 'pl'); }).forEach(function(p){
      var r = document.createElement('div'); r.className = 'row'; r.textContent = p[0] + ' → ' + p[1]; box.appendChild(r);
    });
    box.classList.remove('hide'); $('dl').classList.remove('hide');
  };

  $('dl').onclick = function(){
    if(!pairs) return;
    var json = JSON.stringify({ p: pairs.map(function(p){ return [enc(p[0]), enc(p[1])]; }) });
    var out = SRC.replace(/\/\*D\*\/[\s\S]*?\/\*E\*\//, function(){ return '/*D*/' + json + '/*E*/'; });
    var m = $('adminMsg');
    if(typeof claude === 'undefined' || !claude.use){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
      a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      m.textContent = 'Pobrano index.html. Wrzuć go na GitHub albo Netlify.'; m.className = 'msg';
      return;
    }
    claude.use('downloads').then(function(d){
      if(!d){ m.textContent = 'Pobieranie jest tu niedostępne. Otwórz pobrany plik index.html na komputerze.'; m.className = 'msg err'; return; }
      return d.save({ filename: 'index.html', data: out }).then(function(){
        m.textContent = 'Pobrano index.html. Wrzuć go na GitHub albo Netlify.'; m.className = 'msg';
      }, function(e){
        m.textContent = (e && e.code === 'declined') ? 'Anulowano pobieranie.' : 'Nie udało się pobrać pliku.'; m.className = 'msg err';
      });
    });
  };

  renderUser();
})();
</script></body></html>
